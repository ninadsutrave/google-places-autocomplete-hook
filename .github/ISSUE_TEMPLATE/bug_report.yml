name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: Code
      description: The smallest code that shows the problem. A CodeSandbox or StackBlitz link is even better.
      render: tsx
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: placeahead 0.1.0, React 18.3, Chrome 130
    validations:
      required: true
  - type: dropdown
    id: entry
    attributes:
      label: Which import
      options:
        - placeahead
        - placeahead/compat
