name: pages

on:
  push:
    branches: [main]
    paths: ['src/**', 'example/**', 'package.json', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.repository == 'ninadsutrave/google-places-autocomplete-hook'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            example/package-lock.json
      - run: npm ci
      - run: npm run build
      # no VITE_GOOGLE_MAPS_KEY here, so the demo uses its built-in places and never calls Google
      - run: npm ci
        working-directory: example
      - run: npm run build
        working-directory: example
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: example/dist
      - id: deploy
        uses: actions/deploy-pages@v4
